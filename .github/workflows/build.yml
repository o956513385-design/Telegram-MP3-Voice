name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - mp3-to-voice
      
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;27.2.12479018"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew TMessagesProj_App:assembleBundleAfatRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-MP3-Voice
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error

      - name: Prepare APK for Release
        run: |
          mkdir -p release
          find . -type f -path '*/build/outputs/apk/**/*.apk' -exec cp {} release/app.apk \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Telegram-MP3-Voice v1.0.${{ github.run_number }}"
          files: release/app.apk
          generate_release_notes: true
